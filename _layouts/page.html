---
# Front matter comment to ensure Jekyll properly reads file.
---

<!DOCTYPE html>
<html lang="en-us">

{% include head.html %}

<body class="subPageBody">

    <a class="ap-skip" href="#main">Skip to content</a>

    {% include header.html %}

    <main id="main" class="ap-wrap ap-subpage-pad">
        {% unless content contains "<h1" %}<h1 class="ap-h2" style="margin-bottom:26px">{{ page.title }}</h1>{% endunless %}
        <article class="page markdown-body">
            {{ content }}
        </article>
    </main>

    {% include footer.html %}

</body>

</html>
