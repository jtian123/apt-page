<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title class="pageTitle">{% if page.title %}{{ page.title }} · {{ site.app_name }}{% else %}{{ site.page_title }}{% endif %}</title>
	<meta name="description" content="{{ site.app_description }}">

	{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
	<link rel="canonical" href="{{ page.url | absolute_url }}">

	<!-- Open Graph / social -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.app_name }}{% else %}{{ site.page_title }}{% endif %}">
	<meta property="og:description" content="{% if page.title %}{{ page.title }} — {{ site.app_name }}.{% else %}{{ site.app_description }}{% endif %}">
	<meta property="og:image" content="{{ site.app_icon | absolute_url }}">
	<meta name="twitter:card" content="summary_large_image">

	<link rel="shortcut icon" href="{{ site.app_icon | relative_url }}">
	<link rel="apple-touch-icon" href="{{ site.app_icon | relative_url }}">

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
		<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">


	{% comment %} Sub-pages keep the legacy markdown styling; every page gets the new site system on top. {% endcomment %}
	{% if page.url != '/' %}
		<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
	{% endif %}
	<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
